<!doctype html>
<html lang="id" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin Tirta Asri</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1a15">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/lucide-static@0.469.0/font/lucide.css" rel="stylesheet">
<style>
:root{--r:.75rem}
[data-theme=light]{--bg:#fff;--fg:#09090b;--card:#fff;--muted:#f4f4f5;--mfg:#62626b;--acc:#f4f4f5;--border:#e4e4e7;--input:#d4d4d8;--des:#dc2626;--side:#fafafa;--p:#8a5a00;--pfg:#fff;--ring:#8a5a00;}
[data-theme=dark]{color-scheme:dark;--bg:#0b1a15;--fg:#f3f6ee;--card:#102219;--muted:#1b3329;--mfg:#a9bbae;--acc:#1b3329;--border:#223c31;--input:#335044;--des:#f87171;--side:#0d1f18;--p:#f2c14e;--pfg:#1c1505;--ring:#f2c14e;}
/* Komponen mengikuti pola visual shadcn/ui: netral, bingkai 1px, radius kecil, satu warna utama */
*,*::before,*::after{box-sizing:border-box;border-color:var(--border)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 .875rem/1.5 Geist,system-ui,sans-serif;-webkit-font-smoothing:antialiased;--ctl:36px}
@media (max-width:767px),(pointer:coarse){body{--ctl:44px}}
h1,h2,h3,p,dl,dd{margin:0}
h1{font-size:1.5rem;font-weight:600;letter-spacing:-.025em;line-height:1.2}
h2{font-size:1rem;font-weight:600;letter-spacing:-.01em;line-height:1.3}
h3{font-size:.875rem;font-weight:500}
a{color:inherit}
img{display:block;max-width:100%;background:var(--muted)}
button,select,summary,label[for]{cursor:pointer}
input,select,textarea,button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
[class^=icon-],[class*=" icon-"]{font-size:16px;line-height:1;flex:none}
.lewati{position:absolute;left:8px;top:-60px;z-index:90;background:var(--card);padding:8px 12px;border:1px solid var(--border);border-radius:var(--r)}
.lewati:focus{top:8px}
.m{color:var(--mfg)}
.xs{font-size:.75rem}
.b{font-weight:500}
.tnum{font-variant-numeric:tabular-nums}

/* Kerangka */
.app{min-height:100dvh}
.sb{position:fixed;inset:0 auto 0 0;z-index:50;width:256px;display:flex;flex-direction:column;background:var(--side);border-right:1px solid var(--border);transform:translateX(-100%);visibility:hidden;transition:transform .2s ease,visibility .2s}
.sb.buka{transform:none;visibility:visible}
.ov{position:fixed;inset:0;z-index:45;background:rgb(0 0 0 / .6)}
.sb-h{display:flex;align-items:center;gap:10px;padding:12px;min-height:56px}
.logo{width:32px;height:32px;display:grid;place-content:center;flex:none;background:var(--p);color:var(--pfg);border-radius:var(--r)}
.sb-h b{display:block;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.sb-n{flex:1;overflow-y:auto;padding:4px 8px}
.sb-g{padding:8px 8px 4px;font-size:.75rem;font-weight:500;color:var(--mfg)}
.sb-n button{display:flex;align-items:center;gap:8px;width:100%;min-height:var(--ctl);padding:0 8px;background:none;border:0;border-radius:calc(var(--r) - 2px);text-align:left;transition:background .15s}
.sb-n button:hover{background:var(--acc)}
.sb-n button[aria-current=page]{background:var(--acc);font-weight:500}
.sb-c{margin-left:auto;min-width:20px;padding:0 6px;background:var(--p);color:var(--pfg);border-radius:99px;font-size:.75rem;font-weight:500;text-align:center}
.sb-f{display:flex;gap:10px;align-items:center;margin:8px;padding:8px;border:1px solid var(--border);border-radius:var(--r)}
.av{width:32px;height:32px;display:grid;place-content:center;flex:none;background:var(--muted);border-radius:99px;font-size:.75rem;font-weight:600}
.sb-f p{line-height:1.3}
.isi{min-width:0;transition:margin .2s ease}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.remah{display:flex;align-items:center;gap:6px;min-width:0;color:var(--mfg);white-space:nowrap}
.remah b{font-weight:500;color:var(--fg);overflow:hidden;text-overflow:ellipsis}
.remah span{display:none}
.top .kanan{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
main{padding:20px 16px 48px;max-width:1320px;margin-inline:auto}
main:focus{outline:0}
.kp{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.kp p{color:var(--mfg);margin-top:4px;max-width:60ch}
@media (min-width:1024px){
  .sb{transform:none;visibility:visible}
  .sb.tutup{transform:translateX(-100%);visibility:hidden}
  .isi{margin-left:256px}
  .isi.lebar{margin-left:0}
  .ov{display:none}
  .remah span{display:inline}
  main{padding:24px 24px 56px}
}
@media (min-width:640px){.remah span{display:inline}}

/* Tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--ctl);padding:0 14px;background:var(--p);color:var(--pfg);border:1px solid transparent;border-radius:var(--r);font-weight:500;text-decoration:none;white-space:nowrap;transition:background .15s,opacity .15s,color .15s}
.btn:hover{opacity:.9}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.out{background:var(--bg);color:var(--fg);border-color:var(--input)}
.btn.out:hover,.btn.gh:hover{background:var(--acc);opacity:1}
.btn.gh{background:transparent;color:var(--fg)}
.btn.sec{background:var(--muted);color:var(--fg)}
.btn.des{background:var(--des);color:#fff}
.btn.ic{width:var(--ctl);padding:0}
.btn.sm{min-height:max(32px,calc(var(--ctl) - 4px));padding:0 10px;font-size:.8125rem}
.btn.sm.ic{width:max(32px,calc(var(--ctl) - 4px));padding:0}

/* Lencana */
.bdg{display:inline-flex;align-items:center;gap:6px;padding:1px 8px;border:1px solid var(--border);border-radius:99px;font-size:.75rem;font-weight:500;white-space:nowrap}
.bdg.sec{background:var(--muted);border-color:transparent}
.bdg.pri{background:var(--p);color:var(--pfg);border-color:transparent}
.bdg i.t{width:7px;height:7px;border-radius:99px;background:var(--c,var(--mfg))}

/* Kartu */
.card{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--r) + 4px);box-shadow:0 1px 2px rgb(0 0 0 / .05);min-width:0}
.ch{padding:16px 16px 0}
.ch p{color:var(--mfg);margin-top:2px}
.cb{padding:16px}
.cf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border)}
.tile .cb{display:grid;gap:6px}
.tile .a{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:500}
.tile .a i{color:var(--mfg)}
.tile .v{font-size:1.625rem;font-weight:700;letter-spacing:-.025em;line-height:1.15;overflow-wrap:anywhere}
.g4,.g2,.g73,.gk{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
.tum{display:grid;gap:14px}
.list>*{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 0;border-top:1px solid var(--border)}
.list>*:first-child{border-top:0;padding-top:0}
.list>*:last-child{padding-bottom:0}
.list>*>div:first-child{flex:1 1 180px;min-width:0}
.kosong{padding:32px 16px;text-align:center;color:var(--mfg)}
.kosong i{display:block;font-size:24px;margin-bottom:8px}
.alert{display:flex;gap:10px;padding:12px 14px;margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r)}
.alert i{margin-top:2px}
.alert p{color:var(--mfg)}
@media (min-width:640px){.gk{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:1100px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g73{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}.gk{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Tabel data */
.dt-t{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px}
.tabs{display:flex;gap:2px;max-width:100%;overflow-x:auto;padding:3px;background:var(--muted);border-radius:var(--r);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:calc(var(--ctl) - 6px);padding:0 10px;background:none;border:0;border-radius:calc(var(--r) - 2px);color:var(--mfg);font-weight:500}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-pressed=true]{background:var(--bg);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .1)}
.tabs small{font-size:.75rem;color:var(--mfg);font-variant-numeric:tabular-nums}
.cari{position:relative;flex:1 1 200px;max-width:320px}
.cari i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--mfg);pointer-events:none}
.cari input{padding-left:32px}
.inp{display:block;width:100%;min-height:var(--ctl);padding:6px 10px;background:transparent;border:1px solid var(--input);border-radius:var(--r);box-shadow:0 1px 1px rgb(0 0 0 / .03)}
.inp::placeholder{color:var(--mfg)}
.inp:focus-visible{outline-offset:0}
select.inp{background:var(--bg)}
textarea.inp{min-height:88px;resize:vertical}
input[type=date].inp{cursor:pointer}
[aria-invalid=true]{border-color:var(--des)!important}
.mas{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--muted);border-block:1px solid var(--border)}
.mas b{font-weight:500;margin-right:auto}
.tbl-w{border-top:1px solid var(--border)}
table{width:100%;border-collapse:collapse;table-layout:auto}
th{height:40px;padding:0 10px;text-align:left;font-weight:500;color:var(--mfg);white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:middle;overflow-wrap:anywhere}
tbody tr{transition:background .1s}
tbody tr:hover{background:color-mix(in srgb,var(--muted) 50%,transparent)}
tbody tr[data-sel=true]{background:var(--muted)}
tbody tr:last-child td{border-bottom:0}
.c-pil{width:40px;padding-right:0}
.c-aksi{width:48px;padding-left:0;text-align:right}
.pil{display:inline-grid;place-content:center;width:max(28px,calc(var(--ctl) - 8px));height:max(28px,calc(var(--ctl) - 8px));cursor:pointer}
.cek{appearance:none;-webkit-appearance:none;margin:0;width:16px;height:16px;background:var(--bg);border:1px solid var(--input);border-radius:4px;display:grid;place-content:center;cursor:pointer}
.cek:checked{background:var(--p);border-color:var(--p)}
.cek:checked::after{content:"";width:8px;height:4px;border-left:2px solid var(--pfg);border-bottom:2px solid var(--pfg);transform:translateY(-1px) rotate(-45deg)}
.cek:indeterminate{background:var(--p);border-color:var(--p)}
.cek:indeterminate::after{content:"";width:8px;height:2px;background:var(--pfg)}
.nm{font-weight:500}
.sub{display:none;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:3px;color:var(--mfg);font-size:.8125rem}
.dt-f{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-top:1px solid var(--border);color:var(--mfg)}
.dt-f div{display:flex;gap:6px}
.hd{display:table-cell}
@media (max-width:719px){.hd{display:none}.sub{display:flex}.cari{max-width:none;flex-basis:100%}}

/* Switch */
.sw{position:relative;flex:none;width:36px;height:20px;padding:0;background:var(--input);border:0;border-radius:99px;transition:background .15s}
.sw::before{content:"";position:absolute;inset:-12px -4px}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;background:#fff;border-radius:99px;box-shadow:0 1px 2px rgb(0 0 0 / .3);transition:transform .15s}
.sw[aria-checked=true]{background:var(--p)}
.sw[aria-checked=true]::after{transform:translateX(16px)}
.swb{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:44px}

/* Menu tarik-turun */
.mn{position:fixed;z-index:80;min-width:176px;padding:4px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 8px 24px rgb(0 0 0 / .16)}
.mn button{display:flex;align-items:center;gap:8px;width:100%;min-height:max(32px,calc(var(--ctl) - 4px));padding:0 8px;background:none;border:0;border-radius:calc(var(--r) - 2px);text-align:left}
.mn button:hover,.mn button:focus-visible{background:var(--acc);outline:0}
.mn .des{color:var(--des)}
.mn hr{margin:4px -4px;border:0;border-top:1px solid var(--border)}

/* Dialog dan sheet */
dialog{padding:0;background:var(--card);color:var(--fg);border:1px solid var(--border);border-radius:calc(var(--r) + 4px);box-shadow:0 16px 48px rgb(0 0 0 / .24);width:min(480px,100vw - 24px);max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgb(0 0 0 / .6)}
.d-h{padding:20px 20px 0;padding-right:52px}
.d-h h2{font-size:1.125rem}
.d-h p{margin-top:4px;color:var(--mfg)}
.d-b{display:grid;gap:14px;padding:16px 20px}
.d-f{display:flex;flex-wrap:wrap-reverse;justify-content:flex-end;gap:8px;padding:0 20px 20px}
.d-x{position:absolute;right:8px;top:8px}
.fld label{display:block;font-weight:500;margin-bottom:6px}
.fld .h{margin-top:4px;color:var(--mfg);font-size:.8125rem}
.err{margin-top:4px;color:var(--des);font-size:.8125rem;font-weight:500}
.g-f{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:640px){.g-f.d{grid-template-columns:repeat(2,minmax(0,1fr))}}
dialog.sheet{margin:0 0 0 auto;width:min(440px,100vw);height:100dvh;max-height:100dvh;max-width:100vw;border-width:0 0 0 1px;border-radius:0}
dialog.sheet[open]{display:flex;flex-direction:column}
dialog.sheet .d-b{flex:1;overflow-y:auto;align-content:start}
dialog.sheet .d-f{padding-top:12px;border-top:1px solid var(--border)}
.dl{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:8px 12px}
.dl dt{color:var(--mfg)}

/* Toast */
.toasts{position:fixed;right:16px;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:95;display:grid;gap:8px;justify-items:end;pointer-events:none}
.toast{display:flex;gap:10px;width:min(360px,100%);padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:0 8px 24px rgb(0 0 0 / .16);animation:masuk .2s ease}
.toast i{margin-top:2px}
.toast b{display:block;font-weight:500}
.toast p{color:var(--mfg)}
@keyframes masuk{from{opacity:0;transform:translateY(8px)}}

/* Grafik batang: satu seri, ujung atas membulat 4px, nilai lengkap saat disorot */
.bars{display:flex;align-items:stretch;gap:2px;height:188px;margin-top:8px}
.bar{position:relative;flex:1 1 0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-radius:4px;cursor:default}
.bar:hover{background:var(--muted)}
.bar .n{font-size:.75rem;font-weight:500;line-height:1.5;visibility:hidden}
.bar[data-lbl=true] .n{visibility:visible}
.bar:hover .n,.bar:focus-visible .n{visibility:visible}
.bar .m1{width:min(100%,28px);background:var(--p);border-radius:4px 4px 0 0}
.bar .l{height:22px;padding-top:4px;font-size:.75rem;line-height:1.5;color:var(--mfg);white-space:nowrap;border-top:1px solid var(--border);width:100%;text-align:center}
.tb-g{margin-top:10px}
.tb-g summary{min-height:32px;display:flex;align-items:center;color:var(--mfg);font-size:.8125rem}
.tb-g td,.tb-g th{padding:4px 10px;height:auto}

/* Kotak masuk */
.pos{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.pos-l{padding:6px}
.pos-l button{display:block;width:100%;padding:10px;background:none;border:0;border-radius:var(--r);text-align:left}
.pos-l button:hover{background:var(--acc)}
.pos-l button[aria-pressed=true]{background:var(--muted)}
.pos-l .a{display:flex;justify-content:space-between;gap:8px;font-weight:500}
.pos-l .a small{font-size:.75rem;font-weight:400;color:var(--mfg);white-space:nowrap}
.pos-l p{margin-top:2px;color:var(--mfg);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.utas{display:grid;gap:10px;margin-bottom:14px}
.utas p{padding:10px 12px;background:var(--muted);border-radius:var(--r);max-width:90%;justify-self:start}
.utas p.kita{background:var(--p);color:var(--pfg);justify-self:end}
@media (min-width:860px){.pos{grid-template-columns:minmax(0,5fr) minmax(0,7fr);align-items:start}}

/* Kartu berfoto */
.foto img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:calc(var(--r) + 3px) calc(var(--r) + 3px) 0 0}
.bint{display:inline-flex;gap:1px;color:var(--p)}
.bint i{font-size:14px}
.bint i.off{color:var(--input)}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (forced-colors:active){.bar .m1{background:CanvasText}}
.list>.kosong{display:block}
@media (max-width:479px){.top a.btn{width:var(--ctl);padding:0}.top a.btn span{display:none}}
</style>
</head>
<body>
<a class="lewati" href="#utama">Langsung ke isi</a>
<div class="ov" id="ov" hidden></div>
<div class="app">
  <aside class="sb" id="sb" aria-label="Menu admin">
    <div class="sb-h"><span class="logo"><i class="icon-bed-double" aria-hidden="true"></i></span><div><b id="merek">Tirta Asri</b><span class="m xs">Panel admin</span></div></div>
    <nav class="sb-n" id="nav" aria-label="Halaman admin"></nav>
    <div class="sb-f"><span class="av" aria-hidden="true">AD</span><div><p class="b">Admin demo</p><p class="m xs">Perubahan hilang saat dimuat ulang</p></div></div>
  </aside>
  <div class="isi" id="isi">
    <header class="top">
      <button type="button" class="btn gh ic" id="tSamping" aria-label="Buka atau tutup menu" aria-controls="sb" aria-expanded="false"><i class="icon-panel-left" aria-hidden="true"></i></button>
      <div class="remah"><span>Admin</span><span aria-hidden="true">/</span><b id="remah"></b></div>
      <div class="kanan">
        <span class="bdg sec">Demo</span>
        <button type="button" class="btn gh ic" id="tTema"><i class="icon-moon" aria-hidden="true"></i></button>
        <a class="btn out" href="index.html" aria-label="Lihat situs"><i class="icon-external-link" aria-hidden="true"></i><span>Situs</span></a>
      </div>
    </header>
    <main id="utama" tabindex="-1"><div class="kp" id="kp"></div></main>
  </div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<script>
const $ = id => document.getElementById(id);
function h(tag, p = {}, ...kids) {
  const e = document.createElement(tag);
  for (const k in p) {
    if (p[k] === undefined || p[k] === null) continue;
    if (k === 'on') for (const n in p.on) e.addEventListener(n, p.on[n]);
    else if (k in e && !/^(aria|data|role|for|list)/.test(k)) e[k] = p[k];
    else e.setAttribute(k, p[k]);
  }
  e.append(...kids.flat().filter(x => x !== null && x !== undefined && x !== false));
  return e;
}
const ic = n => h('i', {className: 'icon-' + n, 'aria-hidden': 'true'});
const btn = (teks, o = {}) => h('button', {type: o.type || 'button', className: 'btn ' + (o.v || '') + (o.sm ? ' sm' : '') + (teks ? '' : ' ic'), 'aria-label': o.label, disabled: o.disabled, on: o.on ? {click: o.on} : undefined}, o.icon ? ic(o.icon) : null, teks || null);
const bdg = (teks, v = '') => h('span', {className: 'bdg ' + v}, teks);
const stat = (teks, warna) => { const s = h('span', {className: 'bdg'}, h('i', {className: 't'}), teks); s.firstChild.style.setProperty('--c', warna); return s; };
const pt = (cls, teks) => h('p', {className: cls, textContent: teks});

// Toast
const riwayat = [];
function kabari(judul, isi, catat = true) {
  const t = h('div', {className: 'toast'}, ic('circle-check'), h('div', {}, h('b', {textContent: judul}), isi ? h('p', {textContent: isi}) : null));
  $('toasts').append(t);
  setTimeout(() => t.remove(), 3200);
